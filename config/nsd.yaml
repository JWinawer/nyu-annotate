################################################################################
# This file contains the configuration for the cortex-annotate toolkit. By
# editing this file, one can configure cortex-annotate to work with various
# datasets and to enable annotation of specific contours, points, and
# boundaries.

display:
  figsize: [4, 4]
  dpi: 128
  active_style:
    color: [0.97, 0.97, 0.97]
    markersize: 4
  default_style:
    color: [0.55, 0.55, 0.9]
    markersize: 0
    linewidth: 2
    linestyle: "solid"


init: |
  # Load libraries that will be used throughout the configuration file.
  import re
  import glob
  import numpy as np
  import os.path as op
  import neuropythy as ny
  from struct import unpack
  from matplotlib.colors import LinearSegmentedColormap

  # Cortical sulcus labels, drawn on fsaverage (NSD data, Kendrick Kay). They come
  # from the NSD bucket (nsddata/freesurfer/fsaverage/label). All subjects here
  # are stored on fsaverage vertices, so the same labels apply to everyone.
  # They are atlas labels: small sulci (ptCoS, mFus, OTS) can miss a subject's
  # own folds, so check them against the curvature.
  import colorsys
  import nibabel as nib
  SULCI_DIR   = op.join("/home", "jovyan", "datasets", "sulci")
  SULCI       = {} # hemisphere -> label per fsaverage vertex (0 = none)
  SULCI_NAMES = {} # label number -> short name
  if op.isdir(SULCI_DIR):
    for h in ( "lh", "rh" ):
      fname    = op.join(SULCI_DIR, f"{h}.corticalsulc.mgz")
      SULCI[h] = np.asarray(nib.load(fname).dataobj).ravel().astype(int)
    with open(op.join(SULCI_DIR, "corticalsulc.mgz.txt")) as f:
      for line in f:
        parts = line.split()
        if len(parts) >= 2:
          SULCI_NAMES[int(parts[0])] = parts[1]

  def sulcus_color(k):
    """Color for sulcus label k (the 3D viewer uses the same rule)."""
    return colorsys.hsv_to_rgb((k * 0.618034) % 1.0, 0.75, 0.95)

  # Define directories
  dataset  = "nsd"
  data_dir = op.join("/home", "jovyan", "datasets", dataset)

  # define flatmap kwargs
  FLATMAP_KWARGS = {
    "mask"      : ( "parcellation", 43 ), 
    "map_right" : "right",
    "radius"    : np.pi / 2
  }

  # load fsaverage as a subject object
  fsa = ny.freesurfer_subject("fsaverage")

  # prepare fsaverage flatmap
  fsa_flatmaps = {} # initialize
  fsa_flatmaps["lh"] = fsa.hemis["lh"].mask_flatmap(**FLATMAP_KWARGS)
  fsa_flatmaps["rh"] = fsa.hemis["rh"].mask_flatmap(**FLATMAP_KWARGS)

  # define a custom colormap for isoeccentricity figures
  edge_cmap = LinearSegmentedColormap.from_list(
    name = "edge", 
    colors = [
      (0, (0, 1, 1)),    # negative values begin at cyan
      (0.49, (0, 0, 0)), # black edge, just before the threshold value
      (0.50, (1, 1, 0)), # yellow edge, at the threshold value
      (0.51, (1, 1, 1)), # white edge, just after the threshold value
      (1, (1, 0, 0))     # positive values go towards red
    ]
  )

  
targets:
  # The "Participant" is a choice for the user. It will appear as a dropdown 
  # menu with these two options in the annotation tool.
  Participant:
    - subj01
    - subj02
    - subj03
    - subj04
    - subj05
    - subj06
    - subj07
    - subj08

  # The "Hemisphere" is a choice for the user; as a list of two options, it will
  # appear as a dropdown menu with these two options in the annotation tool.
  Hemisphere:
    - Left Hemisphere
    - Right Hemisphere

  # create subject flatmap.
  flatmap: |
    # get dropdown selections from above choices.
    participant = target["Participant"] # string
    hemi        = target["Hemisphere"]  # string

    # format dropdown items
    fs_hemi = f"{hemi[0].lower()}h"

    # define participant directory
    participant_dir = op.join(data_dir, participant)

    # find all participant property files
    prop_files = glob.glob(op.join(participant_dir, f"{fs_hemi}.2d.*"))

    # read in all subject properties
    props = {} # initialize
    for fname in prop_files: # for each property file
      prop_name = fname.split(".")[-1]
      with open(fname, "rb") as f:
        values = f.read() # read property file, float16
        values = unpack("e" * (len(values) // 2), values)
      props[prop_name] = values

    # copy fsaverage flatmap 
    participant_flatmap = fsa_flatmaps[fs_hemi].copy()

    # attach sulcus labels (fsaverage atlas), if available
    if fs_hemi in SULCI:
      props["sulci"] = SULCI[fs_hemi][participant_flatmap.labels]

    # attatch and return properties to fsaverage flatmap
    return participant_flatmap.with_prop(props)


annotations:
  # Face Areas (variable)
  Face Areas:
    type: boundary
    variable: true
    variable_options: [ "IOG-faces", "pFus-faces", "mFus-faces" ]
    figure_grid: 
     - [ "faces", "sulci" ]
  # Body Areas (variable)
  Body Areas:
    type: boundary
    variable: true
    variable_options: [ "ITG-bodies", "LOS-bodies" ]
    figure_grid: 
     - [ "bodies", "sulci" ]
  # Place Areas (variable)
  Place Areas:
    type: boundary
    variable: true
    variable_options: [ "CoS-places" ]
    figure_grid: 
     - [ "places", "sulci" ]
  # Word Areas (variable)
  Word Areas:
    type: boundary
    variable: true
    variable_options: [ "VWFA-1", "VWFA-2" ]
    figure_grid: 
     - [ "words", "sulci" ]


figures:
  _: |
    ny.cortex_plot(
      mesh  = target["flatmap"], 
      color = key,
      cmap  = "temperature_dark", 
      vmin  = -8,
      vmax  = 8, 
      axes  = axes
    )
  curvature: |
    ny.cortex_plot(mesh = target["flatmap"], axes = axes)
  sulci: |
    # curvature with sulcus label outlines and names on top
    import matplotlib.patheffects as pe
    fm = target["flatmap"]
    ny.cortex_plot(mesh = fm, axes = axes)
    if "sulci" in fm.properties:
      labels = np.asarray(fm.prop("sulci")).astype(int)
      (x, y) = fm.coordinates
      faces  = fm.tess.indexed_faces.T
      for k in np.unique(labels[labels > 0]):
        inside = (labels == k)
        if inside.sum() < 20: continue # skip tiny slivers at the map edge
        color = sulcus_color(k)
        axes.tricontour(x, y, faces, inside.astype(float), levels = [0.5],
                        colors = [color], linewidths = 0.8)
        # put the name on the labelled vertex nearest the label's median
        (mx, my) = (np.median(x[inside]), np.median(y[inside]))
        ii = np.flatnonzero(inside)
        jj = ii[np.argmin((x[ii] - mx)**2 + (y[ii] - my)**2)]
        axes.text(x[jj], y[jj], SULCI_NAMES.get(k, str(k)), color = color,
                  fontsize = 5, ha = "center", va = "center",
                  path_effects = [pe.withStroke(linewidth = 1.5, foreground = "k")])
  term: |
    # figure aesthetics and limits
    xy = target["flatmap"].coordinates
    (xmin, ymin) = np.min(xy, axis = 1)
    (xmax, ymax) = np.max(xy, axis = 1)
    axes.set_xlim((xmin, xmax))
    axes.set_ylim((ymin, ymax))